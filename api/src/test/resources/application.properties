# Configuración de pruebas: usa un MongoDB local (o el servicio del CI)
spring.mongodb.uri=mongodb://localhost:27017/photobogota_test
spring.mongodb.database=photobogota_test

# Logs de prueba en un directorio temporal del build
logging.file.name=target/test-logs/photobogota-test.log

# Orígenes CORS para los tests de seguridad
application.security.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Carpeta de uploads de prueba
app.upload.dir=target/test-uploads
storage.local.ruta=target/test-uploads
storage.local.url-base=http://localhost:8080/uploads

# JWT de prueba (clave fija, solo para tests)
application.security.jwt.secret=bG9jYWwtZGUtcHJ1ZWJhLXNlY3JldG8tanBvYmlnaC1kZS1wcnVlYmEtcHVlYmE
application.security.jwt.expiration=86400000
application.security.jwt.refresh-expiration=604800000

# Correo: JavaMailSender se crea solo si hay host; los tests no envían correos reales
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test